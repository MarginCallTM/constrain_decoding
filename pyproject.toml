[project]
name = "call-me-maybe"
version = "0.1.0"
description = "42 School - Function calling with LLMs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "llm-sdk",
    "numpy>=2.4.6",
    "pydantic>=2.14.1",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"